openapi: 3.0.3
info:
  title: Galon Delivery API
  version: 1.0.0
  description: |
    API pemesanan & pengiriman air galon. Semua respons memakai envelope
    `{ success, data, meta? }` atau `{ success: false, error: { code, message, details? } }`.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string } }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: {}
  responses:
    Ok: { description: Berhasil, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: {}, meta: { type: object } } } } } }
    Error: { description: Gagal, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: "Registrasi customer"
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: "Login (email/nomor HP)"
      requestBody:
        content:
          application/json:
            schema: { type: object }
